name: Bug report
description: Report a problem in the user-facing frontend
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste passwords, cookies, API keys, internal hostnames or personal data.
        Security issues must be reported privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /card
        2. Enter a card key
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or commit SHA
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Firefox, Safari, Mobile browser, Other]
  - type: textarea
    id: console
    attributes:
      label: Console output (optional)
      description: Remove cookies, tokens and personal data first.
      render: text
