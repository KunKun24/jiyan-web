name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: PHP lint
        run: |
          find public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Secret scan
        run: |
          set -e
          if grep -rInE '/www/wwwroot|Fcuk/Admin|k7Qz9x|JiYan_EnvV13_Sign|BEGIN (RSA |EC )?PRIVATE KEY' public/ \
               --include='*.php' --include='*.js' --include='*.html' --include='*.css' \
               --exclude='*.min.js' --exclude-dir='vendor' --exclude-dir='node_modules' ; then
            echo "Forbidden string found"; exit 1
          fi
          echo "OK"
